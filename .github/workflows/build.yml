name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk AutoTV-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoTV-debug.apk --title "AutoTV (build automática)" --notes "APK debug gerado a partir do commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
