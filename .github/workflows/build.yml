name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTV-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish the APK (one release per version, named AutoTV-X.Y.Z.apk)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/*.apk "AutoTV-$VERSION.apk"

          # Each version has its own release (never deleted, so old versions stay downloadable).
          # The newest is marked as GitHub's "latest": the README links to /releases/latest.
          NOTES="Versão $VERSION (commit ${GITHUB_SHA::7}). Versões anteriores: https://github.com/$GITHUB_REPOSITORY/releases"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "AutoTV-$VERSION.apk" --clobber
            gh release edit "v$VERSION" --notes "$NOTES" --latest
          else
            gh release create "v$VERSION" "AutoTV-$VERSION.apk" --title "AutoTV $VERSION" \
              --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi

          # The old fixed 'latest' release (AutoTV-debug.apk) is no longer used.
          gh release delete latest --yes --cleanup-tag || true
